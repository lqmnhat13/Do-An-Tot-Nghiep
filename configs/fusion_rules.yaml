# Quy tắc hành lang đi thẳng, đồng bộ thời gian và FSM đánh giá rủi ro
walking_corridor:
  center_x: 0.50
  top_y: 0.35
  top_width: 0.20
  bottom_width: 0.60
  min_overlap_ratio: 0.10

# Hướng chỉ mô tả vị trí, không dùng làm điều kiện cảnh báo.
spatial:
  left_ratio: 0.35   # 0% - 35%: Vùng bên trái
  center_ratio: 0.30 # 35% - 65%: Vùng trực diện phía trước
  right_ratio: 0.35  # 65% - 100%: Vùng bên phải

synchronizer:
  max_pair_skew_ms: 600      # Độ lệch thời gian tối đa cho phép giữa detection và depth (ms)
  max_detection_age_ms: 1000 # Tuổi tối đa của detection trước khi coi là stale (ms)
  max_depth_age_ms: 1200     # Tuổi tối đa của depth trước khi coi là stale (ms)
  max_alert_age_ms: 1500     # Tuổi tối đa của dữ liệu nguồn khi chuẩn bị phát cảnh báo (ms)

risk_fsm:
  # Ngưỡng điểm độ gần [0, 1] (lớn hơn = gần hơn):
  depth_threshold_high: 0.75
  depth_threshold_medium: 0.45
  depth_threshold_low: 0.25
  # Với depth.representation = metric_depth, khoảng cách (mét) của phần gần nhất của vật
  # được quy đổi sao cho <= high_m tương ứng điểm >= depth_threshold_high, v.v.
  distance_threshold_high_m: 1.5
  distance_threshold_medium_m: 2.5
  distance_threshold_low_m: 3.5

  # Xác nhận tăng mức; hạ mức ngay khi bbox/độ gần không còn đạt điều kiện.
  confirmations_to_escalate: 1
  confirmations_to_deescalate: 3 # Tương thích cấu hình cũ; không giữ cảnh báo khi hạ mức.
  instant_high_risk_in_center: true # Tên tương thích cũ: kích hoạt HIGH ngay trong hành lang, bất kể hướng.

  # Cooldown tránh lặp lại cảnh báo cùng một đối tượng (giây)
  track_alert_cooldown_sec: 4.0
  # Cho phép ghi đè cooldown nếu mức rủi ro tăng cấp (ví dụ từ MEDIUM lên HIGH)
  allow_escalation_override: true

# Cảnh báo "vật cản" cho vùng gần trong hành lang mà YOLO không nhận diện (tường, mặt bàn,
# cạnh tủ...). Chỉ hoạt động với depth.representation = metric_depth.
generic_obstacle:
  enabled: true
  near_distance_m: 1.0     # chặt hơn ngưỡng HIGH theo vật (1.5 m) để hạn chế cảnh báo thừa
  min_area_ratio: 0.15     # tỉ lệ vùng hành lang (ngoài các bbox đã nhận diện) gần hơn ngưỡng
  floor_ignore_ratio: 0.25 # bỏ dải đáy ảnh (sàn sát chân) khỏi vùng xét

alert_aggregator:
  # Khoảng nghỉ tối thiểu giữa hai cảnh báo bất kỳ (chống dồn dập, tạo khoảng thở cho người dùng)
  global_alert_interval_sec: 3.5
  alert_lifetime_sec: 3.0

