# Cấu hình runtime và phần cứng của ứng dụng
app:
  name: "Local Multimodal Assistive System"
  version: "1.0.0"
  device: "mps" # mps | cpu
  log_level: "INFO"

camera:
  source: 0 # 0 for default webcam, or path to video file, or "dummy"
  width: 640
  height: 480
  fps: 30
  buffer_size: 2 # drop-oldest bounded buffer limit
  # Webcam chụp ở độ phân giải này; detection/depth vẫn nhận vùng giữa đúng tỉ lệ width:height thu
  # về 640x480 (webcam MacBook: chế độ 640x480 chính là vùng giữa 960x720 của 1280x720, nên góc nhìn
  # và hiệu chỉnh depth không đổi). Khung đầy đủ dùng cho nhận diện tiền (phím M) để đọc chữ nhỏ.
  # Đặt null cả hai để quay về chụp thẳng 640x480. Webcam này tối đa 1280x720.
  capture_width: 1280
  capture_height: 720
  reconnect_delay_sec: 2.0
  max_reconnect_attempts: 5

runtime:
  detection_interval_ms: 66 # ~15 FPS
  depth_interval_ms: 125 # ~8 FPS
  watchdog_timeout_sec: 3.0
  enable_preview: true
  preview_width: 800
  preview_height: 600

audio:
  enabled: true
  engine: "say" # say (macOS native) | dummy
  voice: "Linh" # Vietnamese voice on macOS
  speech_rate_wpm: 240 # 200 -> 240: "ghế phía trước" 0,97 s -> 0,83 s; áp dụng cả cho OCR/VQA
  # Clip WAV dựng sẵn cho câu cảnh báo (tạo nền lúc khởi động, phát trong tiến trình ~15 ms
  # thay vì ~0,8 s khởi động của `say`). Đổi giọng/tốc độ sẽ tự dựng bộ clip mới.
  alert_clip_dir: "assets/audio/tts_cache"
  enable_chimes: true
  min_alert_interval_sec: 2.0

ui:
  theme: "dark_hud" # dark_hud
  show_depth_map: true
  show_spatial_guides: true
  show_diagnostics: true
